name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Security scan
        run: >-
          bandit -c bandit.toml
          auth.py config.py database.py detection.py
          main.py models.py schemas.py security.py seed.py seed_admin.py

      - name: Tests
        run: pytest -q
